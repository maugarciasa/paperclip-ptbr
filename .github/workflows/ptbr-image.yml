name: Imagem pt-BR

# Publica no GHCR a imagem do fork (UI em pt-BR) e a variante com FFmpeg e Chromium
# usada na VPS. Só amd64: a VPS é x86 e o build nativo evita o QEMU.
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "ui/**"
      - "server/**"
      - "packages/**"
      - "cli/**"
      - "scripts/**"
      - "Dockerfile"
      - "docker/Dockerfile.video"
      - "pnpm-lock.yaml"
      - ".github/workflows/ptbr-image.yml"

concurrency:
  group: ptbr-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: ghcr.io/maugarciasa/paperclip-ptbr
  VIDEO_IMAGE: ghcr.io/maugarciasa/paperclip-video

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # A imagem de produção passa de 10 GiB; sem isso o runner fica sem disco.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build e push da imagem base
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.BASE_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BASE_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache,mode=max

      - name: Build e push da imagem com FFmpeg e Chromium
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.video
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:sha-${{ github.sha }}
          tags: |
            ${{ env.VIDEO_IMAGE }}:sha-${{ github.sha }}
            ${{ env.VIDEO_IMAGE }}:latest
